spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jpa.open-in-view=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${ALLOWED_ORIGINS}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
app.initial-admin.username=${INITIAL_ADMIN_USERNAME}
app.initial-admin.display-name=${INITIAL_ADMIN_DISPLAY_NAME}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD}

