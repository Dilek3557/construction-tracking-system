spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jpa.open-in-view=false
# DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/is_takip
spring.datasource.username=postgres
spring.datasource.password=12345
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:my-super-secret-key-my-super-secret-key-123456}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:Mustafa}
app.initial-admin.display-name=${INITIAL_ADMIN_DISPLAY_NAME:Yonetici}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:123456}




